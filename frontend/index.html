    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#f97316"
    />

    <!--
      Fallback title.
      Paginile individuale îl suprascriu prin SEOProvider.
    -->
    <title>
  Artfest – Produse handmade, personalizate și pentru evenimente
</title>

    <!--
      Site-ul este public și poate fi indexat.
    -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://media.artfest.ro/branding/LogoArtfest.png"
    />

    <!-- 🌗 Theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = document.documentElement;

          if (t === "light" || t === "dark") {
            d.setAttribute("data-theme", t);
          } else {
            d.removeAttribute("data-theme");
          }
        } catch (e) {}
      })();
    </script>
